
spring.application.name=campocerto

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${POSTGRES_DB:campocerto}
spring.datasource.username=${POSTGRES_USER:campocerto}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway - gerenciamento das migrações do banco
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Servidor Spring Boot
server.port=${SERVER_PORT:8080}

# Docker Compose
spring.docker.compose.enabled=false
