spring.application.name=campocerto

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${POSTGRES_DB:campocerto}
spring.datasource.username=campocerto
spring.datasource.password=SuaSenhaForte123!
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Servidor
server.port=${SERVER_PORT:8080}

# Docker Compose
spring.docker.compose.enabled=false

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=120

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}