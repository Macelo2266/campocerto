<a class="skip-link" href="#conteudo" (click)="skipToContent($event)">Pular para o conteúdo</a>

<header class="site-header">
  <div class="container header-inner">
    <a class="brand" routerLink="/" aria-label="CampoCerto, página inicial">🌾 CampoCerto</a>

    <nav aria-label="Principal">
      <ul class="nav-list">
        <li>
          <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
            Início
          </a>
        </li>

        @if (auth.isLoggedIn()) {
          <li><a class="nav-link" routerLink="/conta" routerLinkActive="active">Minha conta</a></li>
          <li><button type="button" class="nav-link nav-button" (click)="logout()">Sair</button></li>
        } @else {
          <li><a class="nav-link" routerLink="/entrar" routerLinkActive="active">Entrar</a></li>
          <li><a class="nav-link nav-cta" routerLink="/cadastrar">Cadastre-se</a></li>
        }
      </ul>
    </nav>
  </div>
</header>

<main id="conteudo" tabindex="-1">
  <router-outlet />
</main>

<footer class="site-footer">
  <div class="container">
    <p><strong>CampoCerto</strong>: encontre prestadores de serviços rurais na sua região.</p>
    <p>Contato: <a href="mailto:contato@campocerto.example">contato@campocerto.example</a></p>
    <p class="footer-small">© {{ year }} CampoCerto. Projeto de portfólio.</p>
  </div>
</footer>
