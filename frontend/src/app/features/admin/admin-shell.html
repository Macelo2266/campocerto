<div class="container page-section panel">
  <aside class="panel-side">
    <div class="panel-user">
      <app-avatar [name]="auth.user()?.name ?? 'Administrador'" />
      <div>
        <strong>{{ auth.user()?.name }}</strong>
        <span>Administração</span>
      </div>
    </div>

    <h1 class="panel-title">Administração</h1>
    <nav aria-label="Seções da administração">
      <ul class="side-nav">
        <li>
          <a class="side-link" routerLink="/admin" routerLinkActive="active" ariaCurrentWhenActive="page" [routerLinkActiveOptions]="{ exact: true }">
            <app-icon name="grid" /> Resumo
          </a>
        </li>
        <li>
          <a class="side-link" routerLink="/admin/usuarios" routerLinkActive="active" ariaCurrentWhenActive="page">
            <app-icon name="users" /> Usuários
          </a>
        </li>
        <li>
          <a class="side-link" routerLink="/admin/solicitacoes" routerLinkActive="active" ariaCurrentWhenActive="page">
            <app-icon name="file-text" /> Solicitações
          </a>
        </li>
        <li>
          <a class="side-link" routerLink="/admin/avaliacoes" routerLinkActive="active" ariaCurrentWhenActive="page">
            <app-icon name="star" /> Avaliações
          </a>
        </li>
        <li>
          <a class="side-link" routerLink="/admin/categorias" routerLinkActive="active" ariaCurrentWhenActive="page">
            <app-icon name="tag" /> Categorias
          </a>
        </li>
      </ul>
    </nav>
  </aside>

  <div class="panel-main">
    <router-outlet />
  </div>
</div>
