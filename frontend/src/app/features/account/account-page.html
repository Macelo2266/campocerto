@if (auth.user(); as user) {
  <section class="page-narrow">
    <div class="card">
      <div class="account-head">
        <app-avatar [name]="user.name" size="lg" />
        <div>
          <h1>Minha conta</h1>
          <span class="badge badge-ok">{{ roleLabel(user.role) }}</span>
        </div>
      </div>

      <dl class="data-list">
        <dt>Nome</dt>
        <dd>{{ user.name }}</dd>
        <dt>E-mail</dt>
        <dd>{{ user.email }}</dd>
        <dt>Celular</dt>
        <dd>{{ user.phone ?? 'Não informado' }}</dd>
        <dt>Tipo de conta</dt>
        <dd>{{ roleLabel(user.role) }}</dd>
      </dl>

      <button type="button" class="btn btn-secondary" (click)="logout()">
        <app-icon name="log-out" [size]="18" />
        Sair da conta
      </button>
    </div>
  </section>
}
