@if (auth.user(); as user) {
  <section class="page-narrow">
    <div class="card">
      <h1>Minha conta</h1>

      <dl class="data-list">
        <dt>Nome</dt>
        <dd>{{ user.name }}</dd>

        <dt>E-mail</dt>
        <dd>{{ user.email }}</dd>

        <dt>Celular</dt>
        <dd>{{ user.phone ?? 'Não informado' }}</dd>

        <dt>Tipo de conta</dt>
        <dd>{{ roleLabel(user.role) }}</dd>
      </dl>

      <button type="button" class="btn btn-secondary" (click)="logout()">Sair da conta</button>
    </div>
  </section>
}
